version: "3.8"

services:
  # ------------------------------------------------------------------
  # PostgreSQL Database - API Gateway
  # ------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gatewaypassword
      POSTGRES_DB: gateway_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # PostgreSQL Database - User Service
  # ------------------------------------------------------------------
  postgres-user:
    image: postgres:15-alpine
    container_name: postgres-user
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: user_svc
      POSTGRES_PASSWORD: userpassword
      POSTGRES_DB: user_db
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_svc"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # PostgreSQL Database - Template Service
  # ------------------------------------------------------------------
  postgres-template:
    image: postgres:15-alpine
    container_name: postgres-template
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: template_svc
      POSTGRES_PASSWORD: templatepassword
      POSTGRES_DB: template_db
    volumes:
      - postgres_template_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template_svc"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Redis Cache
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass redispassword
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # RabbitMQ Message Broker
  # ------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secretpassword
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # API Gateway Service (Docker mode)
  # ------------------------------------------------------------------
  api-gateway:
    build:
      context: ../services/api_gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - ENV=docker
      - APP_NAME=api-gateway
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - USER_SERVICE_URL=http://user-service:3000
      - TEMPLATE_SERVICE_URL=http://template-service:3002
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=secretpassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redispassword
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=gateway_user
      - POSTGRES_PASSWORD=gatewaypassword
      - POSTGRES_DB=gateway_db
      - JWT_SECRET_KEY=your-secret-key-change-in-production-please-use-strong-random-key
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      template-service:
        condition: service_started
    restart: unless-stopped

  # User Service
  # ------------------------------------------------------------------
  user-service:
    build:
      context: ../services/user_service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://user_svc:userpassword@postgres-user:5432/user_db
      - VALID_API_KEYS=test-api-key,api-key-1
      - JWT_SECRET=your-secret-key-change-in-production
      - REFRESH_TOKEN_SECRET=your-refresh-secret-key-change-in-production
      - RABBITMQ_URL=amqp://admin:secretpassword@rabbitmq:5672/
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      postgres-user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Template Service
  # ------------------------------------------------------------------
  template-service:
    build:
      context: ../services/template-service
      dockerfile: Dockerfile
    container_name: template-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://template_svc:templatepassword@postgres-template:5432/template_db
      - DB_HOST=postgres-template
      - DB_PORT=5432
      - DB_USER=template_svc
      - DB_PASSWORD=templatepassword
      - DB_NAME=template_db
      - REDIS_URL=redis://:redispassword@redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=info
    depends_on:
      postgres-template:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Email Service
  # ------------------------------------------------------------------
  email-service:
    build:
      context: ../services/email-service
      dockerfile: Dockerfile
    container_name: email-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SERVICE_NAME=email-service
      - LOG_LEVEL=info
      - RABBITMQ_URL=amqp://admin:secretpassword@rabbitmq:5672/
      - EMAIL_QUEUE_NAME=email.queue
      - EXCHANGE_NAME=notifications.direct
      - DLX_NAME=notifications.dlx
      - FAILED_QUEUE_NAME=failed.queue
      - REDIS_URL=redis://:redispassword@redis:6379/0
      - API_GATEWAY_URL=http://api-gateway:8000
      - TEMPLATE_SERVICE_URL=http://template-service:3002
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SECURE=false
      - FROM_EMAIL=${FROM_EMAIL:-noreply@example.com}
      - FROM_NAME=Notification System
      - MAX_RETRIES=3
      - CIRCUIT_BREAKER_THRESHOLD=5
      - CIRCUIT_BREAKER_TIMEOUT=60000
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_started
      template-service:
        condition: service_started
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Push Service
  # ------------------------------------------------------------------
  push-service:
    build:
      context: ../services/push_service
      dockerfile: Dockerfile
    container_name: push-service
    ports:
      - "8003:8000"
    environment:
      - RABBITMQ_HOST=amqp://admin:secretpassword@rabbitmq:5672/
      - REDIS_HOST=redis://:redispassword@redis:6379/0
      - FIREBASE_CREDENTIALS=/app/firebase-service-account.json
      - PUSH_QUEUE_NAME=push.queue
    volumes:
      - ../services/push_service/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_user_data:
  postgres_template_data:
  redis_data:
  rabbitmq_data:
