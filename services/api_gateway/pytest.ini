[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts =
    --verbose
    --strict-markers
    --tb=short
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (medium speed, test doubles)
    e2e: End-to-end tests (slow, real services)
    smoke: Smoke tests (critical path only)
